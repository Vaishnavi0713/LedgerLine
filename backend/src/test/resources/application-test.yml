spring:
  application:
    name: ledgerline-backend-test

  datasource:
    url: jdbc:h2:mem:ledgerline_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true

ledgerline:
  security:
    jwt-secret: "TestSecretKeyForTestingPurposesMustBeAtLeast256BitsLongABC123456789"
    jwt-expiration-ms: 3600000
  demo:
    admin-username: "admin@ledgerline.test"
    admin-password: "TestAdminPassword123"
    holder-username: "holder@ledgerline.test"
    holder-password: "TestHolderPassword123"
    auditor-username: "auditor@ledgerline.test"
    auditor-password: "TestAuditorPassword123"
